<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="cs-routeros-bouncer logo">
	<!--
		THE MARK — traffic meeting a boundary. Four lanes run left to right;
		three cross the rail and continue, one stops dead at it. That is what
		this daemon does, and the proportion is deliberate: a firewall does
		not block everything, it blocks the exception.

		The pass/stop distinction is carried by LENGTH before it is carried
		by colour, so the mark still reads in greyscale and on paper. That is
		not decoration: the accent and the subordinate tone measure 1.01 to 1
		apart in the light theme, so anything relying on that pair alone to
		tell two things apart would collapse into one tone.

		NO ids, NO defs, NO clipPath, NO mask. The mark this replaced used a
		clipPath and a mask whose ids were document-global and collided the
		moment it was inlined twice on one page — which the header lockup
		plus any hero does.

		This copy is served as a plain <img> where no page token can reach
		it, and INLINED by the header lockup, where brandSvg() deletes the
		<style> below — a <style> inside inline SVG applies to the entire
		host document, which is a bug and not a fallback. `color-scheme:
		light` pins CanvasText to black whatever the reader's OS prefers,
		because Starlight picks between this file and logo-dark.svg from the
		SITE theme.

		The lane and halt colours are the UA's own ink and subordinate tone
		rather than a hand-copied pair, so nothing there can drift. The rail
		is the one exception: there is no system colour for a brand accent
		(AccentColor is the READER's OS accent, not ours), so it carries the
		light-theme accent as a literal. scripts/render-brand-rasters.mjs
		asserts that literal still equals the token in theme.css, so it
		cannot drift either.
	-->
	<style>
		svg {
			color-scheme: light;
		}
		.rb-mark__lane {
			fill: CanvasText;
		}
		.rb-mark__halt {
			fill: GrayText;
		}
		.rb-mark__rail {
			fill: #4d4a98;
		}
	</style>
	<path class="rb-mark__lane" d="M4 4h56v8H4zM4 20h44v8H4zM4 52h52v8H4z"/>
	<path class="rb-mark__halt" d="M4 36h16v8H4z"/>
	<path class="rb-mark__rail" d="M20 0h8v64h-8z"/>
</svg>
