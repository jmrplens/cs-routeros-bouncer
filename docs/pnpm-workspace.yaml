# This project deliberately tracks the latest releases (incl. day-0).
# Disable pnpm 11's default 24h supply-chain age gate, which would
# otherwise block freshly-published packages like Astro 7.
minimumReleaseAge: 0

allowBuilds:
  sharp: true

# A patched release of a transitive build-time tool that its parents do not
# allow yet (pnpm audit, 2026-10-22):
# - katex 0.18.2+ (GHSA-238p-pmpm-9mq7): mermaid 11.17.2 and
#   micromark-extension-math 3.1.0 still ask for ^0.16; no diagram here uses
#   math. It resolves to 0.18.10, as 0.18.11 is deprecated (it shipped the
#   breaking change of 0.19.0).
# Drop it once its parents move.
overrides:
  katex: ^0.18.2
