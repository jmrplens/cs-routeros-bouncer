# OpenSSF Scorecard: an automated read of this repository's supply-chain
# posture — branch protection, pinned dependencies, signed releases, whether
# CI runs a SAST, and a dozen more checks.
#
# It is here because Go Report Card, whose badge this repository used to carry,
# shut down on 2026-07-01 and now serves a badge reading "retired". Its own
# maintainers point at golangci-lint (which this project already runs, with 53
# linters) for code quality, and the gap that leaves is supply-chain posture.
# Scorecard fills that and publishes a result the badge can read.
#
# `publish_results: true` is what makes the badge resolve; without it the
# shields endpoint answers "invalid repo path". It publishes only an analysis
# of public repository metadata.
#
# The actions here are pinned to commit SHAs while the rest of this repository
# pins to release tags. The inconsistency is deliberate: this is the one
# workflow holding `id-token: write`, so a tag repointed under it could mint an
# OIDC token in this repository's name. Elsewhere a moved tag costs a bad build.
# Scorecard's own Pinned-Dependencies check will report the rest of the tree —
# which is the sort of thing it is here to surface.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to the code-scanning dashboard.
      security-events: write
      # Needed to publish the results and get a badge.
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # codeql-bundle-v2.26.4
        with:
          sarif_file: results.sarif
