name: Auto-assign

on:
  issues:
    types: [opened]
  # pull_request_target, not pull_request: under pull_request a pull request
  # from a fork gets a read-only token whatever `permissions` asks for, so
  # assigning it failed with "Resource not accessible by integration" (403,
  # #149), and the job only runs for authors other than the owner, who come
  # from forks. This job checks out nothing and runs no code from the pull
  # request: it calls the API with the number, so the base repository's
  # token is safe to hand it.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened]

permissions:
  contents: read

jobs:
  assign:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    if: >-
      (github.event_name == 'issues' && github.event.issue.user.login != 'jmrplens' && github.event.issue.user.login != 'dependabot[bot]') ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.user.login != 'jmrplens' && github.event.pull_request.user.login != 'dependabot[bot]')
    steps:
      - name: Assign to jmrplens
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/issues/$NUMBER/assignees" \
            -f assignees[]=jmrplens